<style>

:root {

  --logo-filter: none;

  :root:not([data-theme="light"]) {

    --line: #2C3746; --brand: #C9D5E3; --brand-ink: #131A23; --brand-soft: #26313F; --gold: #C8A97E; --gold-soft: #2B2720;
    --c-prot: #86AECB; --c-carb: #5E6E83; --c-fat: #C8A97E; --over: #DB9468; --focus: #C8A97E; --logo-filter: brightness(0) invert(.9);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161E; --surface: #19212C; --surface-2: #222C39; --fg: #E7ECF2; --muted: #9DA8B7;
  --line: #2C3746; --brand: #C9D5E3; --brand-ink: #131A23; --brand-soft: #26313F; --gold: #C8A97E; --gold-soft: #2B2720;
  --c-prot: #86AECB; --c-carb: #5E6E83; --c-fat: #C8A97E; --over: #DB9468; --focus: #C8A97E; --logo-filter: brightness(0) invert(.9);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));

}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.app { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; min-width: 0; }

.display { font-family: var(--font-display); }

.small { font-size: 13px; }
.icon { width: 22px; height: 22px; flex: none; }

.topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.brandname { font-family: var(--font-display); font-weight: 700; font-size: 21px; letter-spacing: 0; line-height: 1.05; white-space: nowrap; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand .logo { width: 38px; height: auto; flex: none; filter: var(--logo-filter); }

.strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }

.hint { display: flex; gap: 12px; align-items: flex-start; background: var(--brand-soft); border-color: transparent; }

.btn { min-height: 48px; padding: 0 20px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .55; cursor: not-allowed; }
.btn.ghost { background: transparent; }
.btn.small { min-height: 44px; font-size: 14px; padding: 0 14px; }


.meal { display: flex; flex-direction: column; gap: 4px; }
.mealhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.mealhead h3 { font-family: var(--font-display); font-size: 18px; }
.mealhead .kc { font-size: 14px; color: var(--muted); }
.mealhead .left { display: flex; align-items: baseline; gap: 10px; }
.entries { list-style: none; margin: 0; padding: 0; }
.entry { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-top: 1px solid var(--line); }
.entry:first-child { border-top: 0; }
.entry .txt { flex: 1; min-width: 0; }
.entry .nm { font-weight: 600; overflow-wrap: anywhere; }

.nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); display: flex; justify-content: center; z-index: 20;
  padding: 6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.nav-in { display: grid; grid-template-columns: repeat(6, 1fr); width: 100%; max-width: 520px; gap: 4px; }
.navbtn { border: 0; background: transparent; min-height: 52px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11.5px; padding: 0 2px; font-weight: 600; color: var(--muted); }
.navbtn[aria-current="page"] { color: var(--fg); background: var(--brand-soft); }

.sheetback { position: fixed; inset: 0; background: rgba(12, 18, 27, .55); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 520px; max-height: 92%; overflow-y: auto; border-radius: 24px 24px 0 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
.sheethead { display: flex; align-items: center; justify-content: space-between; }

.chips { display: flex; gap: 6px; flex-wrap: wrap; }

.tabs { display: flex; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 14px; }

label.fl { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: var(--muted); }
input[type=text], input[type=search], input[type=number], select, textarea {
  width: 100%; min-height: 48px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font-size: 16px; }
textarea { resize: vertical; min-height: 88px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.foodlist { display: flex; flex-direction: column; max-height: 230px; overflow-y: auto; border: 1px solid var(--line); border-radius: 14px; }
.food { display: flex; justify-content: space-between; gap: 8px; align-items: center; text-align: left; border: 0; border-top: 1px solid var(--line); background: transparent; min-height: 52px; padding: 8px 12px; }

.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--surface-2); border-radius: 14px; padding: 12px; }

.sec h2 { font-family: var(--font-display); font-size: 20px; margin-bottom: 4px; }
.sec { display: flex; flex-direction: column; gap: 12px; }
@media (max-width: 380px) { .summary { grid-template-columns: 1fr; justify-items: center; } .macros { width: 100%; } }
/* Asistente en formato chat */
body.chatmode { padding-bottom: calc(150px + env(safe-area-inset-bottom, 0px)); }
.aipill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 99px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }

.minisum { display: flex; align-items: center; gap: 12px; padding: 10px 14px; }

.bubble { max-width: 84%; min-width: 0; padding: 10px 14px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); font-size: 15px; line-height: 1.45; overflow-wrap: anywhere; }
.bubble p { margin: 0; }

.msg.ai .bubble { border-bottom-left-radius: 6px; }
.msg.me .bubble { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); border-bottom-right-radius: 6px; }

.bubble img.ph { display: block; width: 100%; max-width: 260px; max-height: 260px; object-fit: cover; border-radius: 14px; }

.est-row .right { display: flex; align-items: center; gap: 6px; margin-left: auto; }

.composer[hidden] { display: none; }

.est-row .txt { flex: 1 1 150px; min-width: 0; }
.est-row .nm { font-weight: 600; font-size: 14px; }

.qbtn { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface-2); display: grid; place-items: center; padding: 0; font-size: 16px; line-height: 1; }

.typing { display: inline-flex; gap: 4px; align-items: center; padding: 4px 2px; }

.typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
.suggest { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.suggest button { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 8px 12px; font-size: 13px; color: var(--fg); }
.composer { position: fixed; left: 0; right: 0; bottom: calc(65px + env(safe-area-inset-bottom, 0px)); z-index: 19; background: var(--bg); border-top: 1px solid var(--line);
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); display: flex; justify-content: center; }
.composer form { display: flex; align-items: flex-end; gap: 8px; width: 100%; max-width: 520px; }

<body>


<div class="app" id="app"></div>
<nav class="nav" aria-label="Secciones"><div class="nav-in" id="nav"></div></nav>
<div class="composer" id="composer" hidden>
  <form id="chatForm" autocomplete="off">
    <input type="file" id="camIn" accept="image/*" hidden>
    <button type="button" class="roundbtn" id="camBtn" aria-label="Adjuntar foto de mi comida"></button>

  function brandHead(title) {
    return '<div class="brand"><img class="logo" alt="Clínica Systémae" src="' + LOGO + '"><div><div class="brandname">' + esc(title) + '</div><span class="sub">Clínica Systémae</span></div></div>';
  }
  function notice() {
    return '<div class="notice">' + IC.info + '<p><b>Las calorías y nutrientes de esta app son estimaciones orientativas.</b> Pueden variar según la marca, la preparación y el tamaño real de la porción. Este diario te ayuda a observar tus hábitos, pero no reemplaza las indicaciones de tu doctora ni de tu nutricionista.</p></div>';
  }
  function privacy() {
    return '<p class="privacy">Tu diario se guarda solo en este teléfono. No te pedimos nombre, RUT ni correo, y la app no guarda tus fotos.</p>';
  }
  function renderNav() {
    var items = [['asistente', 'Asistente', IC.spark], ['hoy', 'Diario', IC.book], ['semana', 'Resumen', IC.chart], ['meta', 'Meta', IC.target], ['pauta', 'Pauta', IC.doc], ['contacto', 'Contacto', IC.chat]];
    $('#nav').innerHTML = items.map(function (it) {
      return '<button class="navbtn" data-act="nav" data-v="' + it[0] + '"' + (UI.view === it[0] ? ' aria-current="page"' : '') + '>' + it[2] + '<span>' + it[1] + '</span></button>';
    }).join('');
  }

  function weekStrip() {
    var d = dateOf(UI.date), dow = (d.getDay() + 6) % 7, start = addDays(UI.date, -dow), L = ['L', 'M', 'M', 'J', 'V', 'S', 'D'], out = '';
    for (var i = 0; i < 7; i++) {
      var k = addDays(start, i), has = entriesOf(k).length > 0;
      out += '<button class="day' + (has ? ' has' : '') + '" data-act="day" data-k="' + k + '" aria-pressed="' + (k === UI.date) + '" aria-label="' + esc(dayLabel(k)) + (has ? ', con registros' : '') + '">' +
        '<span class="dl">' + L[i] + '</span><span class="dn">' + dateOf(k).getDate() + '</span><span class="dot"></span></button>';
    }
    return '<div class="strip">' + out + '</div>';
  }

  function hintText(t) {
    var g = S.goal;
    if (!entriesOf(UI.date).length) return 'Anota lo que comes durante el día y aquí verás cuánto te queda de calorías, proteínas, carbohidratos y grasas.';
    if (t.kcal > g.kcal * 1.05) return 'Superaste la meta por ' + fmt(t.kcal - g.kcal) + ' kcal. Un día suelto no cambia la tendencia; lo que cuenta es el promedio de la semana.';
    var keys = [['p', 'proteína', 'pollo, huevo, legumbres o lácteos'], ['c', 'carbohidratos', 'arroz, papa, avena o fruta'], ['f', 'grasas', 'palta, frutos secos o aceite de oliva']];
    var worst = null, ratio = 0;
    keys.forEach(function (k) { var r = (g[k[0]] - t[k[0]]) / g[k[0]]; if (r > ratio) { ratio = r; worst = k; } });
    if (!worst || ratio < 0.15) return 'Vas dentro de la meta. Te quedan ' + fmt(Math.max(0, g.kcal - t.kcal)) + ' kcal para el resto del día.';
    return 'Te faltan ' + fmt(g[worst[0]] - t[worst[0]]) + ' g de ' + worst[1] + '. Buenas fuentes: ' + worst[2] + '.';
  }

  function viewHoy() {
    var t = totals(UI.date), g = S.goal, r = 54, C = 2 * Math.PI * r;
    var pct = Math.min(1, t.kcal / g.kcal), over = t.kcal > g.kcal;
    var rem = g.kcal - t.kcal;
    var macro = function (name, key, color) {
      var w = Math.min(100, g[key] ? (t[key] / g[key]) * 100 : 0);
      return '<div class="macro"><div class="row"><b>' + name + '</b><span>' + fmt(t[key]) + ' / ' + fmt(g[key]) + ' g</span></div><div class="bar" role="img" aria-label="' + name + ' ' + fmt(t[key]) + ' de ' + fmt(g[key]) + ' gramos"><i style="width:' + w + '%;background:' + color + '"></i></div></div>';
    };
    var html = '';
    html += '<div class="topbar">' + brandHead('Diario de Calorías') + '<div class="datenav"><button class="iconbtn" data-act="prev" aria-label="Día anterior">' + IC.left + '</button><div class="datelabel" aria-live="polite">' + esc(dayLabel(UI.date)) + '</div><button class="iconbtn" data-act="next" aria-label="Día siguiente">' + IC.right + '</button></div></div>';
    html += weekStrip();
    html += '<section class="card summary" aria-label="Resumen del día"><div class="ringwrap"><svg viewBox="0 0 148 148" aria-hidden="true"><circle class="ring-track" cx="74" cy="74" r="' + r + '"/><circle class="ring-val' + (over ? ' over' : '') + '"' + (pct > 0 ? '' : ' style="opacity:0"') + ' cx="74" cy="74" r="' + r + '" stroke-dasharray="' + (C * pct).toFixed(1) + ' ' + C.toFixed(1) + '"/></svg>' +
      '<div class="ringtext"><span class="big">' + fmt(Math.abs(rem)) + '</span><span class="lbl">' + (over ? 'kcal sobre la meta' : 'kcal restantes') + '</span></div></div>' +
      '<div class="macros">' + macro('Proteínas', 'p', 'var(--c-prot)') + macro('Carbohidratos', 'c', 'var(--c-carb)') + macro('Grasas', 'f', 'var(--c-fat)') + '</div>' +
      '<div class="consumed"><span>Consumido <b>' + fmt(t.kcal) + '</b> kcal</span><span class="muted">Meta ' + fmt(g.kcal) + ' kcal</span></div></section>';
    html += '<div class="card hint">' + IC.leaf + '<p>' + esc(hintText(t)) + '</p></div>';
    html += '<button class="btn primary block" data-act="add" data-meal="' + defaultMeal() + '">' + IC.plus + 'Registrar comida</button>';
    MEALS.forEach(function (m) {
      var list = entriesOf(UI.date).filter(function (e) { return e.meal === m.id; });
      var sum = list.reduce(function (a, e) { return a + e.kcal; }, 0);
      html += '<section class="card meal" aria-label="' + m.name + '"><div class="mealhead"><div class="left"><h3>' + m.name + '</h3><span class="kc">' + fmt(sum) + ' kcal</span></div><button class="iconbtn" data-act="add" data-meal="' + m.id + '" aria-label="Agregar a ' + m.name + '">' + IC.plus + '</button></div>';
      if (!list.length) html += '<div class="empty">Aún no anotas nada aquí.</div>';
      else html += '<ul class="entries">' + list.map(function (e) {
        return '<li class="entry"><div class="txt"><div class="nm">' + esc(e.name) + '</div><div class="dt">' + esc(e.detail || '') + (e.detail ? ' · ' : '') + 'P ' + fmt(e.p) + ' · C ' + fmt(e.c) + ' · G ' + fmt(e.f) + '</div></div><div class="k">' + fmt(e.kcal) + '</div><button class="iconbtn" data-act="del" data-id="' + e.id + '" aria-label="Eliminar ' + esc(e.name) + '">' + IC.trash + '</button></li>';
      }).join('') + '</ul>';
      html += '</section>';
    });
    html += '<button class="btn block" data-act="nav" data-v="contacto">' + IC.chat + 'Contactar a la clínica</button>';
    html += notice();
    return html;
  }

  function viewSemana() {

    var parts = low.replace(/\b(con|y|mas)\b/g, ',').split(/[,;.+\n]/);

    if (!SH.open) return;
    var ts = tabs();
    if (!ts.some(function (t) { return t[0] === SH.tab; })) SH.tab = 'search';
    var body = '';
    if (SH.tab === 'text') {
      body = '<label class="fl" for="descIn">Qué comiste<textarea id="descIn" placeholder="Ej: 2 huevos revueltos, 1 marraqueta con palta y un café con leche"></textarea></label>' +
        '<button class="btn primary block" data-act="estText" id="estBtn">Estimar con IA</button><div id="estOut"></div><div class="note">La estimación es orientativa. Revisa las cantidades antes de agregar. Lo que escribas se envía solo para calcular la estimación.</div>';
    } else if (SH.tab === 'photo') {
      body = '<label class="fl" for="photoIn">Foto del plato<input id="photoIn" type="file" accept="image/*"></label>' +
        '<div id="photoPrev"></div><label class="fl" for="photoNote">Aclaración opcional<input id="photoNote" type="text" placeholder="Ej: el arroz es integral"></label>' +
        '<button class="btn primary block" data-act="estPhoto" id="estBtn" disabled>Estimar con IA</button><div id="estOut"></div><div class="note">Una foto no muestra el aceite ni las porciones exactas, así que el resultado es solo orientativo. La foto se envía solo para calcular la estimación.</div>';
    } else if (SH.tab === 'search') {
      body = '<label class="fl" for="q">Buscar alimento<input id="q" type="search" placeholder="Ej: arroz, palta, empanada" value="' + esc(SH.q) + '" autocomplete="off"></label><div class="foodlist" id="foodList" role="list"></div><div id="foodSel"></div><div class="note">Valores orientativos por porción. Pueden variar según la marca y la preparación.</div>';
    } else {
      body = '<label class="fl" for="mName">Nombre<input id="mName" type="text" placeholder="Ej: Sándwich de jamón y queso"></label>' +
        '<div class="grid2"><label class="fl" for="mK">Calorías (kcal)<input id="mK" type="number" inputmode="numeric" min="0" max="5000"></label><label class="fl" for="mP">Proteínas (g)<input id="mP" type="number" inputmode="decimal" min="0" max="500"></label><label class="fl" for="mC">Carbohidratos (g)<input id="mC" type="number" inputmode="decimal" min="0" max="800"></label><label class="fl" for="mF">Grasas (g)<input id="mF" type="number" inputmode="decimal" min="0" max="500"></label></div>' +
        '<div class="err" id="mErr" role="alert"></div><button class="btn primary block" data-act="addManual">Agregar</button>';
    }
    $('#sheetRoot').innerHTML = '<div class="sheetback" data-act="back"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">' +
      '<div class="sheethead"><h2 id="sheetTitle">Registrar comida</h2><button class="iconbtn" id="sheetClose" data-act="close" aria-label="Cerrar">' + IC.x + '</button></div>' +
      '<div class="chips" role="radiogroup" aria-label="Comida del día" id="mealRow">' + mealChips() + '</div>' +
      '<div class="tabs" role="tablist">' + ts.map(function (t) { return '<button class="tab" role="tab" data-act="tab" data-t="' + t[0] + '" aria-selected="' + (SH.tab === t[0]) + '">' + t[2] + t[1] + '</button>'; }).join('') + '</div>' +
      '<div id="sheetBody" style="display:flex;flex-direction:column;gap:12px">' + body + '</div></div></div>';
    if (SH.tab === 'search') { renderFoodList(); renderFoodSel(); }
    if (SH.tab === 'text' || SH.tab === 'photo') renderEst();
    if (SH.tab === 'photo') renderPhotoPrev();
  }
  function renderFoodList() {
    var el = $('#foodList'); if (!el) return;
    var q = norm(SH.q.trim());
    var list = FOODS.filter(function (f) { return !q || norm(f.name).indexOf(q) !== -1; }).slice(0, 40);
    el.innerHTML = list.length ? list.map(function (f) {
      return '<button class="food" role="listitem" data-act="pick" data-id="' + f.id + '" aria-pressed="' + (SH.sel === f.id) + '"><span><span>' + esc(f.name) + '</span><br><span class="p">' + esc(f.por) + '</span></span><b>' + f.kcal + ' kcal</b></button>';
    }).join('') : '<div class="empty" style="padding:12px">No encontramos ese alimento. Puedes anotarlo en la pestaña Manual con los datos de la etiqueta.</div>';
  }
  function renderFoodSel() {
    var el = $('#foodSel'); if (!el) return;
    if (SH.sel == null) { el.innerHTML = ''; return; }
    var f = FOODS[SH.sel], m = SH.por;
    el.innerHTML = '<div class="panel"><div><b>' + esc(f.name) + '</b><div class="small muted">Porción base: ' + esc(f.por) + '</div></div>' +
      '<label class="fl" for="por">Porciones<input id="por" type="number" inputmode="decimal" min="0.25" max="20" step="0.25" value="' + m + '"></label>' +
      '<div class="small" id="porSum">' + fmt(f.kcal * m) + ' kcal · P ' + fmt(f.p * m) + ' · C ' + fmt(f.c * m) + ' · G ' + fmt(f.f * m) + '</div>' +
      '<button class="btn primary block" data-act="addFood">Agregar a ' + MEALS.filter(function (x) { return x.id === SH.meal; })[0].name + '</button></div>';
  }
  function renderEst() {
    var el = $('#estOut'); if (!el) return;
    var e = SH.est;
    if (!e) { el.innerHTML = ''; return; }
    if (e.loading) { el.innerHTML = '<div style="display:flex;gap:10px;align-items:center"><div class="spinner"></div><span class="muted">Estimando...</span></div>'; return; }
    if (e.error) { el.innerHTML = '<div class="err" role="alert">' + esc(e.error) + '</div>'; return; }
    var tot = e.items.reduce(function (a, i) { return a + i.kcal; }, 0);
    el.innerHTML = '<div class="panel">' + e.items.map(function (i, idx) {
      return '<div class="est-item"><div class="txt" style="flex:1;min-width:0"><div class="nm" style="font-weight:600;overflow-wrap:anywhere">' + esc(i.name) + '</div><div class="small muted">' + esc(i.qty) + ' · P ' + fmt(i.p) + ' · C ' + fmt(i.c) + ' · G ' + fmt(i.f) + '</div></div><b>' + fmt(i.kcal) + '</b><button class="iconbtn" data-act="estDel" data-i="' + idx + '" aria-label="Quitar ' + esc(i.name) + '">' + IC.trash + '</button></div>';
    }).join('') + '<div style="display:flex;justify-content:space-between"><span class="muted">Total</span><b>' + fmt(tot) + ' kcal</b></div>' +
      '<button class="btn primary block" data-act="estAdd"' + (e.items.length ? '' : ' disabled') + '>Agregar a ' + MEALS.filter(function (x) { return x.id === SH.meal; })[0].name + '</button></div>';
  }
  function renderPhotoPrev() {
    var el = $('#photoPrev'); if (!el) return;
    el.innerHTML = SH.photoUrl ? '<img class="photo-prev" alt="Foto seleccionada" src="' + SH.photoUrl + '">' : '';
    var b = $('#estBtn'); if (b) b.disabled = !SH.photo;
  }

  function addEntries(list, meal) {
    var k = UI.date;
    S.log[k] = (S.log[k] || []).concat(list.map(function (x) {
      return { id: uid(), meal: meal, name: x.name, detail: x.detail || '', kcal: x.kcal, p: x.p, c: x.c, f: x.f };
    }));
    save(); closeSheet(); render();
    toast('Agregado a ' + MEALS.filter(function (m) { return m.id === meal; })[0].name.toLowerCase());
  }

  /* ---------- estimación con IA ---------- */
  var PROMPT = 'Eres nutricionista. Estima las calorías y macronutrientes de lo que comió una persona en Chile. Usa porciones típicas chilenas cuando no se indique cantidad. Separa cada alimento en un ítem. Responde SOLO con JSON válido, sin texto extra, con esta forma exacta: {"items":[{"name":"nombre corto en español","quantity":"cantidad estimada","kcal":0,"protein":0,"carbs":0,"fat":0}]}. Números enteros; protein, carbs y fat en gramos. Si no hay comida identificable, devuelve {"items":[]}.';
  function cleanItems(v) {
    var arr = v && Array.isArray(v.items) ? v.items : [];
    return arr.slice(0, 12).map(function (i) {
      return { name: String(i.name || 'Alimento').slice(0, 80), qty: String(i.quantity || '').slice(0, 60), kcal: num(i.kcal, 5000), p: num(i.protein, 500), c: num(i.carbs, 800), f: num(i.fat, 500) };
    });
  }
  function errMsg(e) {
    var c = e && e.code;
    if (c === 'not_granted') return 'Sin permiso para usar la estimación. Puedes buscar el alimento o ingresarlo a mano.';
    if (c === 'rate_limited') return 'Demasiadas solicitudes seguidas. Espera un momento e inténtalo de nuevo.';
    return 'No se pudo estimar. Intenta de nuevo o usa Buscar o Manual.';
  }
  function runEstimate(text, blob) {
    SH.est = { loading: true }; renderEst();
    var b = $('#estBtn'); if (b) b.disabled = true;
    var input = PROMPT + (text ? '\nDescripción: ' + text : '\nAnaliza la foto adjunta.');
    var p = blob ? sampleFn.json(input, { images: [blob] }) : sampleFn.json(input);
    p.then(function (v) {
      var items = cleanItems(v);
      SH.est = items.length ? { items: items } : { error: 'No se identificó comida. Describe el plato con más detalle.' };
    }, function (e) { SH.est = { error: errMsg(e) }; }).then(function () { renderEst(); var b2 = $('#estBtn'); if (b2) b2.disabled = (SH.tab === 'photo' && !SH.photo); });
  }
  function shrink(file) {
    return new Promise(function (res, rej) {
      var img = new Image(), url = URL.createObjectURL(file);
      img.onload = function () {
        var s = Math.min(1, 1024 / Math.max(img.width, img.height)), cv = document.createElement('canvas');
        cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        URL.revokeObjectURL(url);
        cv.toBlob(function (b) { b ? res(b) : rej(new Error('blob')); }, 'image/jpeg', 0.82);
      };
      img.onerror = function () { URL.revokeObjectURL(url); rej(new Error('img')); };
      img.src = url;
    });
  }

  /* ---------- toast ---------- */
  var toastTimer = null;
  function toast(msg, undo) {
    clearTimeout(toastTimer);
    $('#toastRoot').innerHTML = '<div class="toast"><span>' + esc(msg) + '</span>' + (undo ? '<button data-act="undo">Deshacer</button>' : '') + '</div>';
    toast.undo = undo || null;
    toastTimer = setTimeout(function () { $('#toastRoot').innerHTML = ''; toast.undo = null; }, 5000);
  }

  /* ---------- calculadora de meta ---------- */
  function calc() {
    var p = S.prof;
    var sx = $('#pSex').value, ag = num($('#pAge').value, 99), wt = num($('#pW').value, 250), ht = num($('#pH').value, 230);
    if (!sx || !ag || !wt || !ht) { toast('Completa sexo, edad, peso y estatura para calcular'); return; }
    p.sex = sx; p.age = ag; p.w = wt; p.h = ht;
    p.act = Number($('#pAct').value); p.obj = Number($('#pObj').value);
    var bmr = 10 * p.w + 6.25 * p.h - 5 * p.age + (p.sex === 'm' ? 5 : -161);
    var kcal = Math.max(1200, Math.round(bmr * p.act * (1 + p.obj) / 10) * 10);
    var prot = Math.round(p.w * (p.obj < 0 ? 2.0 : 1.8));
    var fat = Math.round(kcal * 0.27 / 9);
    var carb = Math.max(50, Math.round((kcal - prot * 4 - fat * 9) / 4));
    $('#gK').value = kcal; $('#gP').value = prot; $('#gC').value = carb; $('#gF').value = fat;
    save(); macroCheck();
  }

  /* ---------- eventos ---------- */
  var lastDeleted = null;
  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('[data-act]'); if (!t) return;
    var a = t.getAttribute('data-act');
    if (a === 'back') { if (ev.target === t) closeSheet(); return; }
    switch (a) {
      case 'nav': UI.view = t.getAttribute('data-v'); render(); window.scrollTo(0, 0); break;
      case 'prev': UI.date = addDays(UI.date, -1); render(); if (UI.view === 'asistente') scrollEnd(); break;
      case 'next': UI.date = addDays(UI.date, 1); render(); break;
      case 'day': UI.date = t.getAttribute('data-k'); render(); break;
      case 'add': openSheet(t.getAttribute('data-meal')); break;
      case 'close': closeSheet(); break;
      case 'meal': SH.meal = t.getAttribute('data-m'); $('#mealRow').innerHTML = mealChips(); renderFoodSel(); renderEst(); break;
      case 'tab': SH.tab = t.getAttribute('data-t'); SH.est = null; renderSheet(); break;
      case 'pick': SH.sel = Number(t.getAttribute('data-id')); SH.por = 1; renderFoodList(); renderFoodSel(); break;
      case 'addFood': var f = FOODS[SH.sel], m = SH.por; addEntries([{ name: f.name, detail: (m === 1 ? '' : m + ' x ') + f.por, kcal: Math.round(f.kcal * m), p: Math.round(f.p * m * 10) / 10, c: Math.round(f.c * m * 10) / 10, f: Math.round(f.f * m * 10) / 10 }], SH.meal); break;
      case 'addManual':
        var nm = $('#mName').value.trim(), k = num($('#mK').value);
        if (!nm || !k) { $('#mErr').textContent = 'Escribe un nombre y las calorías para poder agregar.'; break; }
        addEntries([{ name: nm, detail: '', kcal: Math.round(k), p: num($('#mP').value, 500), c: num($('#mC').value, 800), f: num($('#mF').value, 500) }], SH.meal); break;
      case 'estText':
        var txt = $('#descIn').value.trim();
        if (txt.length < 3) { SH.est = { error: 'Describe qué comiste y en qué cantidad aproximada.' }; renderEst(); break; }
        runEstimate(txt, null); break;
      case 'estPhoto':
        if (!SH.photo) break;
        runEstimate(($('#photoNote') && $('#photoNote').value.trim()) || '', SH.photo); break;
      case 'estDel': SH.est.items.splice(Number(t.getAttribute('data-i')), 1); renderEst(); break;
      case 'estAdd': addEntries(SH.est.items.map(function (i) { return { name: i.name, detail: i.qty, kcal: Math.round(i.kcal), p: i.p, c: i.c, f: i.f }; }), SH.meal); break;
      case 'del':
        var id = t.getAttribute('data-id'), list = entriesOf(UI.date), idx = -1, i2;
        for (i2 = 0; i2 < list.length; i2++) if (list[i2].id === id) idx = i2;
        if (idx < 0) break;
        lastDeleted = { k: UI.date, e: list[idx], idx: idx };
        list.splice(idx, 1); save(); render();
        toast('Eliminado del diario', function () { var d = lastDeleted; if (!d) return; (S.log[d.k] = S.log[d.k] || []).splice(d.idx, 0, d.e); save(); render(); lastDeleted = null; });
        break;
      case 'undo': if (toast.undo) { toast.undo(); $('#toastRoot').innerHTML = ''; } break;
      case 'calc': calc(); break;
      case 'welcomeok': setWelcomeSeen(); render(); break;
      case 'range': UI.range = t.getAttribute('data-v'); render(); break;
      case 'pautadel': if (confirm('¿Quitar la pauta de este teléfono?')) pautaDelete(); break;
      case 'install': if (INST.prompt) { var ip = INST.prompt; INST.prompt = null; ip.prompt(); ip.userChoice.then(function () { render(); }).catch(function () {}); } break;
      case 'aihelp':
        pushMsg({ role: 'ai', type: 'text', text: 'Calculo con la tabla de alimentos de la app: porciones típicas chilenas con sus calorías, proteínas, carbohidratos y grasas. Escríbeme qué comiste con cantidades simples, por ejemplo «2 huevos y 1 marraqueta con palta». Si no reconozco algo, búscalo en la lista o anótalo a mano con la etiqueta del envase.\nTodo queda solo en tu teléfono. Las fotos son un recordatorio para ti: no se envían ni se guardan.' });
        render(); scrollEnd(); break;
      case 'csug': $('#chatIn').value = t.getAttribute('data-v'); $('#chatIn').focus(); break;
      case 'cstop': if (aborter) aborter.abort(); break;
      case 'openpick': openSheet(defaultMeal()); SH.tab = 'search'; renderSheet(); break;
      case 'cq': case 'crm': case 'cmeal': case 'cok': case 'cno':
        var cm = findMsg(t.getAttribute('data-m')); if (!cm || cm.status !== 'pending') break;
        if (a === 'cq') { var it = cm.items[Number(t.getAttribute('data-i'))]; it.q = Math.max(0.5, Math.min(10, it.q + Number(t.getAttribute('data-d')))); rescale(it); }
        if (a === 'crm') cm.items.splice(Number(t.getAttribute('data-i')), 1);
        if (a === 'cmeal') cm.meal = t.getAttribute('data-meal');
        if (a === 'cno') cm.status = 'discarded';
        if (a === 'cok' && cm.items.length) {
          cm.status = 'added';
          addEntries(cm.items.map(function (i) { return { name: i.name, detail: (i.q !== 1 ? String(i.q).replace('.', ',') + ' × ' : '') + (i.qty || ''), kcal: i.kcal, p: i.p, c: i.c, f: i.f }; }), cm.meal);
          var tt = totals(UI.date), rem2 = S.goal.kcal - tt.kcal;
          pushMsg({ role: 'ai', type: 'text', text: 'Guardado. Hoy llevas ' + fmt(tt.kcal) + ' kcal' + (rem2 >= 0 ? ' y te quedan ' + fmt(rem2) + ' para llegar a tu meta.' : ', ' + fmt(-rem2) + ' sobre tu meta. Un día no define la semana.') });
        }
        save(); render(); if (a === 'cok') scrollEnd(); break;
      case 'copy':
        var cv = t.getAttribute('data-v');
        try {
          navigator.clipboard.writeText(cv).then(function () { toast('Copiado: ' + cv); }, function () { toast('Mantén presionado el dato para copiarlo'); });
        } catch (e) { toast('Mantén presionado el dato para copiarlo'); }
        break;
      case 'savegoal':
        var g = { kcal: num($('#gK').value), p: num($('#gP').value), c: num($('#gC').value), f: num($('#gF').value) };
        if (g.kcal < 1000) { toast('Revisa la meta: debe ser de al menos 1.000 kcal'); break; }
        S.goal = g; save(); toast('Meta guardada'); break;
    }
  });
  document.addEventListener('change', function (ev) {
    if (ev.target.id === 'pautaFile') { pautaSave(ev.target.files && ev.target.files[0]); ev.target.value = ''; }
  });
  document.addEventListener('input', function (ev) {
    var id = ev.target.id;
    if (id === 'q') { SH.q = ev.target.value; renderFoodList(); }
    else if (id === 'por') {
      var v = Number(ev.target.value); if (!isFinite(v) || v <= 0) return; SH.por = Math.min(v, 20);
      var f = FOODS[SH.sel], s = $('#porSum'); if (s) s.textContent = fmt(f.kcal * SH.por) + ' kcal · P ' + fmt(f.p * SH.por) + ' · C ' + fmt(f.c * SH.por) + ' · G ' + fmt(f.f * SH.por);
    } else if (id === 'gK' || id === 'gP' || id === 'gC' || id === 'gF') macroCheck();
  });
  document.addEventListener('change', function (ev) {
    if (ev.target.id === 'photoIn') {
      var file = ev.target.files && ev.target.files[0]; if (!file) return;
      if (SH.photoUrl) { try { URL.revokeObjectURL(SH.photoUrl); } catch (e) {} }
      shrink(file).then(function (b) { SH.photo = b; SH.photoUrl = URL.createObjectURL(b); SH.est = null; renderPhotoPrev(); renderEst(); },
        function () { SH.photo = null; SH.photoUrl = null; SH.est = { error: 'No se pudo leer esa imagen. Prueba con otra foto.' }; renderPhotoPrev(); renderEst(); });
    }
  });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && SH.open) closeSheet(); });

  $('#camBtn').innerHTML = IC.camera; $('#sendBtn').innerHTML = IC.send;
  $('#camBtn').addEventListener('click', function () { if (!busy) $('#camIn').click(); });
  $('#camIn').addEventListener('change', function (ev) { var f = ev.target.files && ev.target.files[0]; ev.target.value = ''; if (f) handlePhoto(f); });
  $('#chatForm').addEventListener('submit', function (ev) {
    ev.preventDefault(); if (busy) return;
    var v = $('#chatIn').value.trim(); if (!v) return;
    $('#chatIn').value = ''; $('#chatIn').style.height = '';
    handleText(v.slice(0, 600));
  });
  $('#chatIn').addEventListener('keydown', function (ev) { if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); $('#chatForm').requestSubmit ? $('#chatForm').requestSubmit() : $('#sendBtn').click(); } });
  $('#chatIn').addEventListener('input', function (ev) { var el = ev.target; el.style.height = ''; el.style.height = Math.min(120, el.scrollHeight) + 'px'; });

  render(); scrollEnd();
  pautaLoad();
  /* Enlace de la clínica con la meta ya indicada, ej.: ?meta=1600 (opcional &p=&c=&f=) */
  (function () {
    var q; try { q = new URLSearchParams(location.search); } catch (e) { return; }
    var k = Number(q.get('meta'));
    if (!isFinite(k) || k < 1000 || k > 6000) return;
    k = Math.round(k);
    var gv = function (n, def, max) { var v = Number(q.get(n)); return isFinite(v) && v > 0 && v <= max ? Math.round(v) : def; };
    S.goal = { kcal: k, p: gv('p', Math.round(k * 0.2 / 4), 500), c: gv('c', Math.round(k * 0.5 / 4), 800), f: gv('f', Math.round(k * 0.3 / 9), 300) };
    save();
    try { history.replaceState(null, '', location.pathname); } catch (e) {}
    render();
    toast('Tu meta de ' + fmt(k) + ' kcal quedó guardada');
  })();
  getSample().then(function () { if (SH.open) renderSheet(); if (UI.view === 'asistente') render(); });
})();
</script>
<script>
if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }
</script>
</body>
